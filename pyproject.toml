[project]
name = "speit-dl26"
version = "0.1.0"
description = "HF fine-tuning for Influencer vs Observer tweet classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "datasets>=2.19.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
]

# PyTorch 官方 cu124 index（匹配本机驱动 CUDA 12.4）
# 等价于: pip install torch --index-url https://download.pytorch.org/whl/cu124
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
